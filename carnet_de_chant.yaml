book: # Options générales
  lang: fr
  encoding: utf-8
  pictures: no
  template: patacrep.tex
  onesongperpage: no


chords: # Options musicales
  show: yes
  diagramreminder: important
  diagrampage: all
  repeatchords: yes
  lilypond: no
  tablatures: no
  instrument: guitar
  notation: alphascale

template:
  default.tex:
    title: "Carnet de chants"
    author: "Team Work ChamA 2021"
  patacrep.tex:
    subtitle: "territoire de l'isère"
    version: "1.0.1"
    url: ""
    email: "rpp@sgdf38.fr"
    picture: img/OMMS_logoC.png
    picturecopyright: "WikiCommons (\\url{https://fr.wikipedia.org/wiki/Organisation_mondiale_du_mouvement_scout})"
    color:
      songlink: "333333"
      hyperlink: 6064EC
    bgcolor:
      note: F0F0F0
      songnumber: F0F0F0
      index: F0F0F0



authors: # Analyse des auteurs
  separators:
  - and
  - et
  after:
  - by

titles: # Analyse des titres
  prefix:
  - The
  - Le
  - La
  - "L'"
  - A
  - Au
  - Ces
  - De
  - Des
  - El
  - Les
  - Ma
  - Mon
  - Un
  - Une
content:
  - part*: "Chansons françaises"
  - sort:
      key: ["by", "title"]
      content:
        - "chant_francais/*.sg"
  - part*: "Chansons étrangères"
  - sort:
      key: ["by", "title"]
      content:
        - "chant_anglais/*.sg"
  - part*: "Chansons scoutes"
  - sort:
      key: ["by", "title"]
      content:
        - "chant_scout/*.sg"
  - part*: "Chants religieux"
  - sort:
      key: ["by", "title"]
      content:
        - "chants_religieux/*.sg"
