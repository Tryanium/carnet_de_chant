stages:
  - lint
  - build
  - test
  - release
  - deploy

variables:
  DEBUG: true
  REGISTRY_NAME: dockerhub.io/gbelabein
  SB_IMAGE_NAME: songbook-by-patacrep
  DOCKER_IMAGE_NAME: $REGISTRY/$SB_IMAGE_NAME:$CI_COMMIT_REF_SLUG
  DOCKER_IMAGE_LATEST: $REGISTRY_NAME/$SB_IMAGE_NAME:latest

